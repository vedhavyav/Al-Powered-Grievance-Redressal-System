services:
  # ----------------------------------------------------------------------------
  # FastAPI Application Backend + Async AI Worker
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: igrs-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://igrs_user:igrs_password@postgres:5432/igrs_db
      - REDIS_URL=redis://redis:6379/0
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENCAGE_API_KEY=${OPENCAGE_API_KEY:-}
      - JWT_SECRET=${JWT_SECRET:-supersecretdevelopmentjwtkey123456789}
      - AI_WORKER_MAX_RETRIES=3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ----------------------------------------------------------------------------
  # Next.js Frontend Dashboard
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: igrs-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend

  # ----------------------------------------------------------------------------
  # PostgreSQL Database Engine
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: igrs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: igrs_user
      POSTGRES_PASSWORD: igrs_password
      POSTGRES_DB: igrs_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U igrs_user -d igrs_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------------------------
  # Redis Queue & In-Memory Cache Store
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: igrs-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  # ----------------------------------------------------------------------------
  # Prometheus Metrics Scraper & Time-Series DB
  # ----------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: igrs-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
  promdata:
