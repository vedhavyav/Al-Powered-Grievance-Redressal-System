name: IGRS CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # 1. Backend Quality, Linting, Security & Comprehensive Unit/Integration Tests
  # ----------------------------------------------------------------------------
  backend-ci:
    name: Backend Lint, Security & Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 bandit
          pip install -r backend/requirements.txt

      - name: Lint with Flake8
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 backend/app --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 backend/app --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

      - name: Python Security Audit (Bandit)
        run: |
          bandit -r backend/app -ll -ii --exit-zero

      - name: Run All Automated Feature Test Suites
        env:
          DATABASE_URL: "sqlite:///:memory:"
          JWT_SECRET: "ci-test-jwt-secret-key-for-automated-tests"
          GEMINI_API_KEY: "mock-test-gemini-key"
          OPENCAGE_API_KEY: "mock-test-opencage-key"
        run: |
          python -m unittest \
            backend/test_feature_2.py \
            backend/test_feature_3.py \
            backend/test_feature_4.py \
            backend/test_feature_5.py

  # ----------------------------------------------------------------------------
  # 2. Frontend Quality, ESLint, TypeScript & Production Build Verification
  # ----------------------------------------------------------------------------
  frontend-ci:
    name: Frontend Lint, Typecheck & Next.js Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: TypeScript Type Check
        run: npx tsc --noEmit

      - name: Build Next.js Production Bundle
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8000"
        run: npm run build

  # ----------------------------------------------------------------------------
  # 3. Docker Container Build Verification
  # ----------------------------------------------------------------------------
  docker-build:
    name: Docker Container Image Build
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: igrs-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: igrs-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
