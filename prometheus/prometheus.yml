# Prometheus Configuration for IGRS Observability
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "igrs-backend"
    metrics_path: "/metrics"
    scrape_interval: 10s
    scrape_timeout: 5s
    static_configs:
      - targets: ["backend:8000"]
        labels:
          environment: "production"
          service: "igrs-fastapi"
